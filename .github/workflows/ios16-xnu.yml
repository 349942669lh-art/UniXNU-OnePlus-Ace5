name: Ace 5 iOS16 XNU UFS USB
on:
  workflow_dispatch:
    inputs:
      profile:
        description: GUI builds produce a kernel for local packaging with the verified product ADT
        type: choice
        required: true
        default: base
        options:
          - base
          - gui
      touch:
        description: Include the opt-in Ace 5 hardware touch driver (requires GUI)
        type: boolean
        default: false
      wifi:
        description: Include WCN7850 runtime and IO80211 passive scans (requires GUI; firmware stays local)
        type: boolean
        default: false
      gpu:
        description: Include A750 firmware/RAM preparation and gated observation (requires GUI; firmware stays local)
        type: boolean
        default: false
      audio:
        description: Include experimental audio coordinator (requires GUI; native platform provider incomplete)
        type: boolean
        default: false
      modem:
        description: Include the unified modem framework and shared platform resource broker (requires GUI)
        type: boolean
        default: false
permissions:
  contents: read
env:
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install terminal host test dependencies
        run: python -m pip install -r scripts/terminal-requirements.txt
      - name: Validate requested profile
        env:
          PROFILE: ${{ inputs.profile }}
          TOUCH: ${{ inputs.touch }}
          WIFI: ${{ inputs.wifi }}
          GPU: ${{ inputs.gpu }}
          AUDIO: ${{ inputs.audio }}
          MODEM: ${{ inputs.modem }}
        run: |
          if [ "$PROFILE" != gui ] && { [ "$TOUCH" = true ] || [ "$WIFI" = true ] || [ "$GPU" = true ] || [ "$AUDIO" = true ] || [ "$MODEM" = true ]; }; then
            echo 'Touch, Wi-Fi, GPU, audio and modem require the GUI profile' >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          repository: xyyyds0106/ios-vermeer-lab
          ref: d68e05df683f863f054b0f9c063c54d2b1342b2a
          path: reference
      - name: Prepare pinned Wi-Fi host test dependencies
        env:
          BEARSSL_PIN: 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          BEARSSL_TREE: a8f933a27b14eaf3a348fe9b294bf4262dbb216c
        run: |
          set -euo pipefail
          brew install openssl@3
          openssl_prefix=$(brew --prefix openssl@3)
          test -f "$openssl_prefix/include/openssl/evp.h"
          test -f "$openssl_prefix/lib/libcrypto.dylib"
          echo "WIFI_HOST_OPENSSL_PREFIX=$openssl_prefix" >> "$GITHUB_ENV"
          mkdir -p .cache/wifi-sae-bearssl
          git init -q .cache/wifi-sae-bearssl
          # One bounded fallback; never substitute a branch tip or a different version.
          if ! git -C .cache/wifi-sae-bearssl -c fetch.fsckObjects=true fetch -q --depth 1 https://www.bearssl.org/git/BearSSL "$BEARSSL_PIN"; then
            git -C .cache/wifi-sae-bearssl -c fetch.fsckObjects=true fetch -q --depth 1 https://github.com/status-im/BearSSL "$BEARSSL_PIN"
          fi
          git -C .cache/wifi-sae-bearssl checkout -q --detach FETCH_HEAD
          test "$(git -C .cache/wifi-sae-bearssl rev-parse HEAD)" = "$BEARSSL_PIN"
          test "$(git -C .cache/wifi-sae-bearssl rev-parse 'HEAD^{tree}')" = "$BEARSSL_TREE"
          git -C .cache/wifi-sae-bearssl fsck --strict
          # The later, unchanged 0020 staging script fetches this same commit.
          # Reuse only the verified objects via a runner-local URL rewrite.
          git config --global url."file://$GITHUB_WORKSPACE/.cache/wifi-sae-bearssl".insteadOf https://www.bearssl.org/git/BearSSL
          echo "BEARSSL_SOURCE=$GITHUB_WORKSPACE/.cache/wifi-sae-bearssl" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: ${{ inputs.modem }}
        with:
          repository: apple-oss-distributions/xnu
          ref: 1b191cb58250d0705d8a51287127505aa4bc0789
          path: .cache/modem-xnu-base
      - uses: actions/checkout@v4
        if: ${{ inputs.modem }}
        with:
          repository: apple-oss-distributions/hfs
          ref: 31d5ec238dfab485e78a9a30b8b92d13e8914f03
          path: .cache/modem-hfs-source
      - uses: actions/checkout@v4
        if: ${{ inputs.modem }}
        with:
          repository: apple-oss-distributions/libpthread
          ref: a6c70ca0e544347a0377babf748f831577ec24f9
          path: .cache/modem-libpthread-source
      - uses: actions/checkout@v4
        if: ${{ inputs.modem }}
        with:
          repository: Project-Silicium/Mu-Silicium
          ref: 6c6755012728c9f7de748228758bad94d1e9a660
          path: .cache/modem-uefi-base
      - name: Prepare the unified modem validation environment
        if: ${{ inputs.modem }}
        run: |
          python3 -m venv .cache/modem-verify-env
          .cache/modem-verify-env/bin/python -m pip install -r scripts/terminal-requirements.txt
      - name: Validate SM8650 context isolation
        run: |
          python3 scripts/check-driver-modules.py
          python3 -m unittest discover -s tests -p test_driver_modules.py -v
          # Native host tests use Homebrew OpenSSL; keep these paths out of the kernel build.
          export CPATH="$WIFI_HOST_OPENSSL_PREFIX/include${CPATH:+:$CPATH}"
          export LIBRARY_PATH="$WIFI_HOST_OPENSSL_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_smmu.c -o /tmp/smmu-test
          /tmp/smmu-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_touch_reports.c -o /tmp/touch-report-test
          /tmp/touch-report-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_touch_wire.c -o /tmp/touch-wire-test
          /tmp/touch-wire-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_touch_gpio.c -o /tmp/touch-gpio-test
          /tmp/touch-gpio-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_trust_catalog.c -o /tmp/trust-test
          /tmp/trust-test < /dev/null
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_log_bytes.c -o /tmp/log-test
          /tmp/log-test
          for test in ios16_wifi_pcie ios16_wifi_cesta ios16_wifi_bandwidth ios16_wifi_power_cache; do
            clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all "tests/$test.c" -o /tmp/pcie-resource-check
            /tmp/pcie-resource-check
          done
          python3 tests/ios16_wifi_pcie_report.py
          python3 tests/ios16_wifi_handoff.py
          if [ '${{ inputs.wifi }}' = true ]; then
            bash scripts/test-ios16-wifi-runtime.sh
          fi
          python3 tests/ios16_wifi_embed.py
          python3 -m unittest discover -s tests -p 'test_terminal.py'
          python3 -m unittest discover -s tests -p 'test_debug_userland.py'
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/ios16_reboot.c -o /tmp/reboot-test
          /tmp/reboot-test
      - name: Validate physical key decoding and terminal status
        run: |
          bash scripts/test-ios16-keys.sh
          bash scripts/test-ios16-slider.sh
          bash scripts/test-ios16-display-power.sh
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/uefi_hall_prepare.c -o /tmp/hall-prepare-test
          /tmp/hall-prepare-test
          python3 tests/uefi_hall_adapters.py
          python3 -m unittest discover -s tests -p 'test_hall_diagnostics.py'
      - name: Validate audio board mapping and metadata commands
        if: ${{ inputs.audio }}
        run: bash scripts/test-ios16-audio.sh
      - name: Validate screen capture, host viewer and development Setup
        run: |
          test -f tests/ios16_screen.c
          test -f tests/ios16_screen_framebuffer.cpp
          test -f tests/test_screen.py
          bash scripts/test-ios16-screen.sh
          python3 -m unittest discover -s tests -p 'test_ios16_setup.py' -v
      - name: Validate GPU integration
        if: ${{ inputs.gpu }}
        run: |
          python3 scripts/fetch-ios16-gpu-sources.py --out .cache/gpu-source
          python3 scripts/make-gpu-smmu-oracle.py --fetch --out .cache/gpu-source-oracle.c
          bash scripts/test-ios16-gpu.sh
          python3 -m unittest discover -s tests -p 'test_gpu*.py' -v
          python3 tests/ios16_gpu_embed.py
          python3 tests/ios16_gpu_patch.py
      - name: Prepare pinned XNU build and Ace 5 profile
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          python3 reference/tools/strict_profile_patches.py dxb/build.sh
          python3 scripts/prepare-ios16.py --reference reference --work profile-source --out profile ${{ inputs.profile == 'gui' && '--gui' || '' }} ${{ inputs.touch && '--touch' || '' }} ${{ inputs.wifi && '--wifi' || '' }} ${{ inputs.gpu && '--gpu' || '' }} ${{ inputs.audio && '--audio' || '' }} ${{ inputs.modem && '--modem' || '' }}
          python3 tests/ios16_terminal_profile.py profile
          if [ '${{ inputs.profile }}' = gui ]; then
            python3 tests/ios16_fb_perf.py profile
          fi
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I profile-source/vermeer tests/ios16_dma.c -o /tmp/dma-test
          /tmp/dma-test
          python3 scripts/make-ios16-adt.py --reference reference --out profile/giulia-ios16.adt
          python3 tests/ios16_rebase.py reference
          cp profile/*.patch profile/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
      - name: Select compatible Xcode and dependencies
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja
          echo 'Installed Xcode applications:'
          ls -d /Applications/Xcode*.app
          # Xcode 15.0.1 built the last good kernel, but Apple now requires an
          # Apple ID to download it. Xcode 16.0 is the closest preinstalled compiler.
          if [ -d /Applications/Xcode_15.0.1.app ]; then
            XC=/Applications/Xcode_15.0.1.app
          elif [ -d /Applications/Xcode_15.0.app ]; then
            XC=/Applications/Xcode_15.0.app
          elif [ -d /Applications/Xcode_16.app ]; then
            XC=/Applications/Xcode_16.app
          else
            echo 'No Xcode 15.0 or 16.0 installation found' >&2
            exit 1
          fi
          test -d "$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          sudo xcodebuild -license accept || true
          xcodebuild -runFirstLaunch || true
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR==1 {print $2}')" != ""

      - name: Build kernel
        working-directory: dxb
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../xnu-build.log
      - name: Report native compiler errors
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('xnu-build.log')
          if log.is_file():
              count = 0
              with log.open(errors='replace') as stream:
                  for line in stream:
                      line = re.sub(r'\x1b\[[0-9;]*m', '', line).strip()
                      if not re.search(r':\d+:\d+: (?:fatal )?error:|^(?:clang(?:\+\+)?: error:|ld:(?! warning:)|Undefined symbols for architecture)', line):
                          continue
                      count += 1
                      if count <= 20:
                          line = line[:1200]
                          line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error title=XNU compiler diagnostic::' + line)
              print(f'Native compiler diagnostic lines: {count}; complete output is in xnu-build.log')
          PY
      - name: Verify linked services
        run: |
          python3 profile/check-kernel.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet ${{ inputs.profile == 'gui' && '--gui' || '' }}
          python3 -c "from pathlib import Path; assert b'UFS NOT READY KEY 2: WAKE WLUN D0' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
          python3 tests/ios16_platform_match.py --reference reference --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          python3 scripts/fix-ios16-high-physical-cache.py --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet --check
          python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert all(m in b for m in (b'GIULIA SHELL: /dev/giulia-debug ready;',b'GIULIA REG: mapped slot=',b'GIULIA TERM: protocol=2'))"
          if [ '${{ inputs.touch }}' = true ]; then
            python3 -c "from pathlib import Path; assert b'GIULIA TOUCH: controller result=' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
          fi
          if [ '${{ inputs.profile }}' = gui ]; then
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA FBPERF: window_ns=' in b and b'sweetfb_perf' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA DISPLAY POWER: request=' in b and b'GiuliaDisplayPowerFrozen' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert all(m in b for m in (b'GIULIA KEYS: observer polling active',b'GIULIA KEYS: compiled=1',b'GIULIA SLIDER: compiled=1',b'keys.status',b'slider.status'))"
            python3 -c "from pathlib import Path; assert b'GIULIA AMFI: trust catalogue ready;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; assert b'GIULIA LOG: launchd full activity/stderr logging enabled;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; assert b'GIULIA FB: native panel 1264x2780 full coverage;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA SCREEN: panel capture lock unavailable' in b and b'GIULIA SCREEN: queued live=' in b"
          fi
          if [ '${{ inputs.wifi }}' = true ]; then
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA WIFI: PCIe/MHI/QMI/WMI ready;' in b; assert b'IO80211Controller' in b and b'GiuliaWiFiUserClient' in b; assert b'GIULIA WIFI PROFILE: 20H392; station=1; legacy20=1; security=open,wpa2,sae-pmf; data=htt-tcl-reo' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert all(m in b for m in (b'GIULIA WIFI: XNU PCIe link worker',b'giulia_wifip',b'sw-ctrl-pdc-route',b'GWL_LINK_TIMEOUT'))"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA PCI: enumerate result=' in b and b'cap_reason=' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA WIFI: awaiting wifi.start before DMA setup' in b and b'GIULIA SMMU: write-request' in b"
          fi
          if [ '${{ inputs.gpu }}' = true ]; then
            python3 scripts/check-ios16-gpu-kernel.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          fi
          if [ '${{ inputs.modem }}' = true ]; then
            python3 -c "import sys; sys.path.insert(0,'scripts'); from pathlib import Path; from ios16_modem import kernel_declaration; d=kernel_declaration(Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()); assert d['modem_runtime_included'] and d['modem_platform_broker_included']"
          fi
      - name: Run unified modem acceptance against the compiled kernel
        if: ${{ inputs.modem }}
        run: |
          export CPATH="$WIFI_HOST_OPENSSL_PREFIX/include${CPATH:+:$CPATH}"
          export LIBRARY_PATH="$WIFI_HOST_OPENSSL_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          bash scripts/test-ios16-modem.sh --reference reference --recorded-evidence --linked-kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
      - name: Prepare DarwinBoot kernel pointers
        run: python3 scripts/ios16-rebase.py --reference reference --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet --out profile/kernel.macho
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace5-ios16-xnu
          path: |
            dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
            xnu-build.log
            profile/
            reports/modem-system*.json
            reports/modem-system*.log
          retention-days: 14
  boot-image:
    if: ${{ inputs.profile != 'gui' }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      GIULIA_BOOT_ABI: darwin22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ace5-ios16-xnu
          path: kernel-artifact
      - name: Install UEFI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-venv clang llvm lld uuid-dev nasm gcc-aarch64-linux-gnu acpica-tools device-tree-compiler mono-devel ca-certificates-mono mtools
      - name: Make matching FAT payload
        run: |
          python3 scripts/make-ios16-payload.py --kernel kernel-artifact/profile/kernel.macho --adt kernel-artifact/profile/giulia-ios16.adt --out "$RUNNER_TEMP/ios16-payload"
          python3 scripts/verify-payload.py "$RUNNER_TEMP/ios16-payload"
      - name: Build iOS16 UEFI with this payload identity
        run: |
          set -o pipefail
          export GIULIA_PAYLOAD_IDENTITY="$RUNNER_TEMP/ios16-payload/identity.json"
          bash scripts/build-uefi.sh "$RUNNER_TEMP/ace5-ios16" 2>&1 | tee uefi-build.log
      - name: Pack temporary boot v3 image
        run: |
          python3 scripts/pack-payload.py --firmware "$RUNNER_TEMP/ace5-ios16/uefi-giulia/Mu-giulia-0.img" --firmware-report "$RUNNER_TEMP/ace5-ios16/image-verification.json" --payload "$RUNNER_TEMP/ios16-payload/payload.img" --payload-report "$RUNNER_TEMP/ios16-payload/payload.json" --header-version 3 --output "$RUNNER_TEMP/giulia-ios16-ufs-usb.img"
      - uses: actions/upload-artifact@v4
        with:
          name: giulia-ios16-ufs-usb
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/giulia-ios16-ufs-usb.img
            ${{ runner.temp }}/giulia-ios16-ufs-usb.json
            ${{ runner.temp }}/ios16-payload/payload.json
            ${{ runner.temp }}/ios16-payload/identity.json
            kernel-artifact/profile/capture-debug.ps1
            kernel-artifact/profile/debug-terminal.cmd
            kernel-artifact/profile/debug_terminal.py
            kernel-artifact/profile/terminal-requirements.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-boot-build-log
          path: uefi-build.log
          retention-days: 14
